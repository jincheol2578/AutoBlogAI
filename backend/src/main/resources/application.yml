server:
  port: 8080

spring:
  datasource:
  #   url: jdbc:mariadb://localhost:3306/autoblogai?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
  #   username: root
  #   password: 1234
  #   driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:h2:mem:autoblogai;DB_CLOSE_DELAY=-1;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    # properties:
    #   hibernate:
    #     format_sql: true
    #     dialect: org.hibernate.dialect.MariaDBDialect

jwt:
  secret: your-jwt-secret-key
  expiration: 86400000  # 1일 = 1000 * 60 * 60 * 24 (ms 단위)

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace

    